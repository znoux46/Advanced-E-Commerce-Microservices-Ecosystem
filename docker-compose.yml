# ================================================================================
# Advanced E-Commerce Microservices - Docker Compose
# ================================================================================
# This file orchestrates all microservices and infrastructure services

version: '3.8'

services:
  # ================================================================================
  # Infrastructure Services
  # ================================================================================

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=ComplexP@ssw0rd123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - ecommerce-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ComplexP@ssw0rd123! -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - infrastructure

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ecommerce-postgres
    environment:
      - POSTGRES_USER=ecommerce_user
      - POSTGRES_PASSWORD=SecureP@ss2024
      - POSTGRES_DB=ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_user -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - infrastructure

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - infrastructure

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ecommerce-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - infrastructure

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ecommerce-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    profiles:
      - infrastructure

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: ecommerce-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: dev-file
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles:
      - infrastructure

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ecommerce-kafka-ui
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: ecommerce-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8081:8080"
    networks:
      - ecommerce-network
    profiles:
      - infrastructure
      - tools

  # ================================================================================
  # Microservices
  # ================================================================================

  product-service:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.product-service
    container_name: product-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ProductDb;User Id=sa;Password=ComplexP@ssw0rd123!;TrustServerCertificate=True
      - ConnectionStrings__RedisConnection=redis:6379
      - KeyCloak__Url=http://keycloak:8080
      - KeyCloak__Realm=ecommerce-realm
      - KeyCloak__ClientId=product-service
    ports:
      - "5000:5000"
    networks:
      - ecommerce-network
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    profiles:
      - services

  inventory-service:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.inventory-service
    container_name: inventory-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ecommerce_db;Username=ecommerce_user;Password=SecureP@ss2024
      - KeyCloak__Url=http://keycloak:8080
      - KeyCloak__Realm=ecommerce-realm
      - KeyCloak__ClientId=inventory-service
      - Kafka__BootstrapServers=kafka:29092
    ports:
      - "5001:5001"
    networks:
      - ecommerce-network
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    profiles:
      - services

  order-service:
    build:
      context: ./src/OrderService
      dockerfile: ../../../dockerfiles/Dockerfile.order-service
    container_name: order-service
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ecommerce_db
      - SPRING_DATASOURCE_USERNAME=ecommerce_user
      - SPRING_DATASOURCE_PASSWORD=SecureP@ss2024
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=ecommerce-realm
      - KEYCLOAK_RESOURCE=order-service
    ports:
      - "8080:8080"
    networks:
      - ecommerce-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    profiles:
      - services

  ai-service:
    build:
      context: ./src/AIService
      dockerfile: ../../../dockerfiles/Dockerfile.ai-service
    container_name: ai-service
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=postgresql://ecommerce_user:SecureP@ss2024@postgres:5432/ecommerce_db
    ports:
      - "8000:8000"
    networks:
      - ecommerce-network
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - services

# ================================================================================
# Networks
# ================================================================================

networks:
  ecommerce-network:
    driver: bridge

# ================================================================================
# Volumes
# ================================================================================

volumes:
  sqlserver_data:
  postgres_data:
  redis_data:
  kafka_data:
  keycloak_data:
